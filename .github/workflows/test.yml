name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Remote browser: Selenium standalone Chromium as a service container
    services:
      selenium:
        image: selenium/standalone-chromium:latest
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --health-cmd "curl -sf http://localhost:4444/wd/hub/status || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wait for Selenium
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/wd/hub/status | grep -q '"ready": *true'; then
              echo "Selenium is ready"; exit 0
            fi
            sleep 2
          done
          echo "Selenium did not become ready"; exit 1

      - name: Run tests (remote Selenium)
        run: mvn -B clean test -Dremote=true -Dselenoid.url=http://localhost:4444/wd/hub

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
