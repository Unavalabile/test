name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests (headless Chrome, no Selenoid)
        run: >
          mvn -B clean test
          -Dremote=false
          -Dheadless=true
          -Durl=https://demo-qa-app.azurewebsites.net/automation-practice-form

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure results and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure
          path: |
            target/allure-results
            target/site/allure-maven-plugin